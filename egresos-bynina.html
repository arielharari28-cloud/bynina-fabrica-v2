<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egresos By Nina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--bg:#f4f5f7;--card:#fff;--line:#e3e6eb;--muted:#6b7280;--accent:#2b4c7e;--accent-bg:#e8eef7;--ok:#2f7d5b;--ok-bg:#e6f3ec;--warn:#a85a14;--warn-bg:#fbf0e3;--danger:#b42318;--danger-bg:#fdecea;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 14px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.dan{color:var(--danger);border-color:#f3c6c1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:700}
header .u{font-size:13px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;border-radius:0;padding:10px 2px;font-size:12px;color:var(--muted);background:none}
nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{background:var(--card);border-bottom:1px solid var(--line);padding:11px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.list .row:last-child{border-bottom:0}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.pill{font-size:11px;border-radius:999px;padding:3px 9px;white-space:nowrap;border:0}
.p-pend{background:var(--warn-bg);color:var(--warn);font-weight:700}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-na{background:#eef0f3;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.met{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.met .l{font-size:12px;color:var(--muted)}.met .v{font-size:20px;font-weight:700;margin-top:2px}
.up{color:var(--danger)}.down{color:var(--ok)}
.bar{height:6px;background:#edf0f4;border-radius:3px;margin-top:5px}.bar>div{height:6px;background:var(--accent);border-radius:3px}
.ledger-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.lg{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
table.lg th{text-align:right;font-weight:700;padding:9px 8px;border-bottom:2px solid var(--line);background:#fafbfc;font-size:12px;color:var(--muted)}
table.lg td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.lg .l{text-align:left}
table.lg tr{cursor:pointer}
table.lg td.h{color:var(--ok)}
.banner{background:var(--danger-bg);color:var(--danger);border:1px solid #f3c6c1;border-radius:12px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.banner.soft{background:var(--warn-bg);color:var(--warn);border-color:#f0d9bf}
.modal-bg{position:fixed;inset:0;background:rgba(20,25,35,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal h2{font-size:17px;margin:0 0 4px}
.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
.big{font-size:26px;font-weight:700}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.login{max-width:360px;margin:12vh auto;padding:20px}
.login h1{font-size:24px;margin:0 0 4px}
h3{font-size:15px;margin:18px 0 8px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.edit-item{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.edit-item:last-child{border-bottom:0}
.edit-item span{flex:1}
.edit-item button{padding:6px 10px;font-size:13px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyBqZ9ZkYfcDfXVEIGVsZM5_cByJkBXhVeA",
  authDomain:"bynina-c1eec.firebaseapp.com",
  databaseURL:"https://bynina-c1eec-default-rtdb.firebaseio.com",
  projectId:"bynina-c1eec",
  storageBucket:"bynina-c1eec.appspot.com",
  messagingSenderId:"1059883614729",
  appId:"1:1059883614729:web:bynina"
});
const db=firebase.database();
const ROOT='egresos_v1';
const CLOUDINARY_CLOUD='dt6ijkpyy', CLOUDINARY_PRESET='By Nina';

// Usuarios. Los PIN viven en Firebase (egresos_v1/config/pins) y Ariel los cambia desde Ajustes.
const USERS={ariel:{nombre:'Ariel',admin:true},meli:{nombre:'Meli',admin:false}};
const DEFAULT_PINS={ariel:'2801',meli:'1234'};
const TIPOS=['Talleres','Empleados','Proveedores','Varios'];
const DEFAULT_CATS=['Talleres','Tela','Producto terminado','Avíos','Sueldos y vales','Alquiler y servicios','Impuestos','Publicidad','Envíos y logística','Varios'];
const DEFAULT_MEDIOS=['Efectivo local','Transferencia','Echeq','Tarjeta'];

let S={user:localStorage.getItem('egr_user')||null,view:'cargar',cfg:null,cuentas:{},egresos:{},cargos:{},
  movFiltro:'todos',movBusca:'',movLimite:150,cuentaTipo:'Talleres',cuentaAbierta:null,repModo:'semana',repOffset:0,draft:null,programados:{},ocurr:{},calOffset:0,calSel:null,log:{},hUser:'todos',hAcc:'todo',hLim:100,logi:{}};

// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,mon)=>mon==='USD'?'US$ '+(Math.round((n||0)*100)/100).toLocaleString('es-AR',{maximumFractionDigits:2}):'$ '+Math.round(n||0).toLocaleString('es-AR');
const parseMonto=s=>{s=String(s||'').trim().replace(/[^\d.,-]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s))s=s.replace(/\./g,'');return Math.round(parseFloat(s)*100)/100||0};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>iso(new Date());
const fromIso=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fmtF=s=>{if(!s)return'';const[a,b,c]=s.split('-');return c+'/'+b+'/'+a};
const fmtFc=s=>{if(!s)return'';const[a,b,c]=s.split('-');return Number(c)+'/'+Number(b)};
const uid=()=>db.ref().push().key;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
const isAdmin=()=>S.user&&USERS[S.user]&&USERS[S.user].admin;
const activos=obj=>Object.entries(obj||{}).filter(([,v])=>v&&v.activo!==false).sort((a,b)=>(a[1].orden??0)-(b[1].orden??0)||a[1].nombre.localeCompare(b[1].nombre));
const catNom=id=>(S.cfg?.categorias?.[id]?.nombre)||'Sin categoría';
const medNom=id=>(S.cfg?.medios?.[id]?.nombre)||'';
const ctaNom=id=>(S.cuentas[id]?.nombre)||'';
// Moneda: todo es en pesos salvo que la cuenta o el egreso digan USD. La cotización es pesos por dólar.
const TC=()=>Number(S.cfg?.ultimaCotizacion)||0;
const conv=(monto,de,a,cot)=>{monto=Number(monto)||0;de=de||'ARS';a=a||'ARS';if(de===a)return monto;const c=Number(cot)||TC();if(!c)return 0;return de==='USD'?monto*c:monto/c};
const ars=e=>conv(e.monto,e.moneda,'ARS',e.cotizacion);
const monCta=id=>(S.cuentas[id]?.moneda)||'ARS';
const noGasto=e=>!!e.soloAgenda||!!S.cfg?.categorias?.[e.categoria]?.noEsGasto;
// En reportes, un cheque suma recién cuando se marca debitado, en la fecha en que se debitó (su vencimiento, o hoy si se marca antes).
const fDebito=venc=>venc&&venc<=hoy()?venc:hoy();
const fCaja=e=>e.cheque?(e.cheque.debitado?(e.cheque.debitadoFecha||e.cheque.venc||e.fecha):null):e.fecha;
const esCheque=medioId=>/cheq/i.test(medNom(medioId));
const bancoNom=id=>(S.cfg?.bancos?.[id]?.nombre)||'';
const razonNom=id=>(S.cfg?.razones?.[id]?.nombre)||'';
const mesNom=f=>{if(!f)return'';const n=fromIso(f).toLocaleDateString('es-AR',{month:'long',year:'numeric'});return n.charAt(0).toUpperCase()+n.slice(1)};

function lunes(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function rango(modo,offset){const t=new Date();
  if(modo==='semana'){const a=lunes(t);a.setDate(a.getDate()+7*offset);const b=new Date(a);b.setDate(b.getDate()+6);return{desde:iso(a),hasta:iso(b),label:'Semana del '+fmtFc(iso(a))+' al '+fmtFc(iso(b))}}
  const a=new Date(t.getFullYear(),t.getMonth()+offset,1),b=new Date(a.getFullYear(),a.getMonth()+1,0);
  const n=a.toLocaleDateString('es-AR',{month:'long',year:'numeric'});return{desde:iso(a),hasta:iso(b),label:n.charAt(0).toUpperCase()+n.slice(1)}}
const enRango=(f,r)=>f>=r.desde&&f<=r.hasta;
const listaEgresos=()=>Object.entries(S.egresos).map(([id,v])=>({id,...v}));

// ---------- datos ----------
function iniciarDatos(){
  db.ref(ROOT+'/config').on('value',async snap=>{
    let c=snap.val()||{};
    if(!c.categorias||!c.medios||!c.pins){
      const up={};
      if(!c.categorias)DEFAULT_CATS.forEach((n,i)=>up['categorias/'+uid()]={nombre:n,orden:i});
      if(!c.medios)DEFAULT_MEDIOS.forEach((n,i)=>up['medios/'+uid()]={nombre:n,orden:i});
      if(!c.pins)up['pins']=DEFAULT_PINS;
      await db.ref(ROOT+'/config').update(up);return;
    }
    if(!c.migrDeuda){const up={migrDeuda:true};const ya=Object.values(c.categorias).some(x=>x.noEsGasto||/devoluci/i.test(x.nombre));
      if(!ya)up['categorias/'+uid()]={nombre:'Devolución de préstamos',orden:Object.keys(c.categorias).length,noEsGasto:true};
      await db.ref(ROOT+'/config').update(up);return;}
    if(!c.migrCheque){const up={migrCheque:true};if(!Object.values(c.medios).some(x=>/^cheque/i.test(x.nombre)))up['medios/'+uid()]={nombre:'Cheque',orden:Object.keys(c.medios).length};
      await db.ref(ROOT+'/config').update(up);return;}
    S.cfg=c;render();
  });
  db.ref(ROOT+'/cuentas').on('value',s=>{S.cuentas=s.val()||{};render()});
  db.ref(ROOT+'/egresos').on('value',s=>{S.egresos=s.val()||{};render()});
  db.ref(ROOT+'/cargos').on('value',s=>{S.cargos=s.val()||{};render()});
  db.ref(ROOT+'/programados').on('value',s=>{S.programados=s.val()||{};render()});
  db.ref(ROOT+'/ocurrencias').on('value',s=>{S.ocurr=s.val()||{};render()});
  db.ref(ROOT+'/conciliacion').on('value',s=>{S.conc=s.val()||{};if(S.view==='mov'&&S.movModo==='dia')render()});
  db.ref(ROOT+'/caja').on('value',async s=>{const v=s.val()||{};
    if(!v.fuentes){const up={};['Nina Cya - Credicoop','Efectivo local','Mercado Pago'].forEach((n,i)=>up['fuentes/'+uid()]={nombre:n,orden:i,saldo:0});await db.ref(ROOT+'/caja').update(up);return}
    S.caja=v;if(S.view==='agenda'&&S.agModo==='caja')render()});
  // Cortes controlados en Logística (app de fábrica, misma base) para facturar a los talleres desde acá.
  db.ref('fabrica_v5/logistica/items').on('value',s=>{S.logi=s.val()||{};S.logiOk=true;if(S.view==='fact'||S.view==='cuentas')render()});
  db.ref(ROOT+'/log').limitToLast(1000).on('value',s=>{S.log=s.val()||{};if(S.view==='hist')render()});
}

// ---------- login ----------
function renderLogin(){
  $('#app').innerHTML=`<div class="login">
    <h1>Egresos By Nina</h1><p class="sub" style="font-size:14px">Ingresá con tu usuario y clave.</p>
    <label>Usuario</label><div class="chips" id="lu">${Object.entries(USERS).map(([k,u])=>`<button class="chip" data-u="${k}">${u.nombre}</button>`).join('')}</div>
    <label for="lp">Clave</label><input id="lp" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <div id="lerr" class="err"></div>
    <button class="pri" style="width:100%;margin-top:16px" id="lgo">Entrar</button></div>`;
  let sel=null;
  document.querySelectorAll('#lu .chip').forEach(b=>b.onclick=()=>{sel=b.dataset.u;document.querySelectorAll('#lu .chip').forEach(x=>x.classList.toggle('on',x===b));$('#lerr').textContent=''});
  const go=async()=>{
    if(!sel){$('#lerr').textContent='Elegí un usuario.';return}
    const pins=(await db.ref(ROOT+'/config/pins').once('value')).val()||DEFAULT_PINS;
    if($('#lp').value!==String(pins[sel])){$('#lerr').textContent='Clave incorrecta.';return}
    S.user=sel;localStorage.setItem('egr_user',sel);render();
  };
  $('#lgo').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}

// ---------- layout ----------
function render(){
  if(!S.user||!USERS[S.user]){renderLogin();return}
  if(!S.cfg){$('#app').innerHTML='<div class="empty">Cargando…</div>';return}
  const nFact=factPendientes().length;
  const tabs=[['cargar','Cargar'],['agenda','Agenda'],['mov','Movim.'],['cuentas','Cuentas'+(nFact?` <span class="pill p-pend" style="padding:1px 6px">${nFact}</span>`:'')],['rep','Reportes'],['ajustes','Ajustes']];
  $('#app').innerHTML=`<header><h1>Egresos By Nina</h1><span class="u">${USERS[S.user].nombre} · <a href="#" id="salir" style="color:inherit">Salir</a></span></header>
  <div class="wrap">${bannerBackup()}<div id="vista"></div></div>
  <nav>${tabs.map(([k,t])=>`<button data-v="${k}" class="${S.view===k||(k==='cuentas'&&S.view==='fact')?'on':''}">${t}</button>`).join('')}</nav>`;
  $('#salir').onclick=e=>{e.preventDefault();localStorage.removeItem('egr_user');S.user=null;render()};
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;if(b.dataset.v!=='cuentas')S.cuentaAbierta=null;window.scrollTo(0,0);render()});
  const bb=$('#bkbtn');if(bb)bb.onclick=descargarBackup;
  ({hist:vHist,fact:vFact,cargar:vCargar,agenda:vAgenda,mov:vMov,cuentas:vCuentas,rep:vRep,ajustes:vAjustes})[S.view]();
}

function diasDesdeBackup(){const b=S.cfg?.ultimoBackup?.fecha;if(!b)return Infinity;return Math.floor((Date.now()-new Date(b).getTime())/86400000)}
function bannerBackup(){
  const d=diasDesdeBackup();if(d<7)return'';
  const txt=d===Infinity?'Todavía no se descargó ningún backup.':`El último backup fue hace ${d} días.`;
  return `<div class="banner ${S.user==='meli'?'':'soft'}"><span>${txt} Descargalo en Excel antes de seguir.</span><button id="bkbtn" class="pri">Descargar</button></div>`;
}

// ---------- HISTORIAL DE CAMBIOS ----------
// Cada acción queda en /log con quién, cuándo, qué y (en ediciones) qué cambió. En borrados se guarda el dato completo para poder restaurarlo.
function logAcc(accion,tipo,refId,resumen,extra){
  const r=Object.assign({ts:Date.now(),user:S.user,accion,tipo,refId:refId||null,resumen:resumen||''},extra||{});
  return db.ref(ROOT+'/log/'+uid()).set(JSON.parse(JSON.stringify(r)));
}
const resEg=e=>`${money(e.monto,e.moneda)} · ${ctaNom(e.cuenta)||catNom(e.categoria)}${e.cheque?' · cheque N° '+e.cheque.num:''}${e.nota&&!e.cuenta?' · '+e.nota:''}`;
const EST_TXT={pendiente:'Pendiente de bajar',bajado:'Bajado',na:'Sin cta. cte.'};
function diffEg(a,b){
  const F=[['monto','Monto',(v,o)=>money(v,o.moneda)],['fecha','Fecha',fmtF],['categoria','Categoría',catNom],['cuenta','Cuenta',v=>ctaNom(v)||'sin cuenta'],['medio','Medio',medNom],['nota','Nota',v=>v||'vacía'],['estado','Estado',v=>EST_TXT[v]||v],['moneda','Moneda',v=>v||'ARS'],['cotizacion','Cotización',v=>v?money(v):'—']];
  const out=[];F.forEach(([k,l,f])=>{const x=a[k]??null,y=b[k]??null;if(String(x??'')!==String(y??''))out.push(`${l}: ${f(x,a)} → ${f(y,b)}`)});
  const ca=a.cheque||{},cb=b.cheque||{};
  if((ca.num||'')!==(cb.num||''))out.push(`N° cheque: ${ca.num||'—'} → ${cb.num||'—'}`);
  if((ca.venc||'')!==(cb.venc||''))out.push(`Vencimiento: ${fmtF(ca.venc)||'—'} → ${fmtF(cb.venc)||'—'}`);
  if(!!a.soloAgenda!==!!b.soloAgenda)out.push(b.soloAgenda?'Marcado como cheque anterior (no suma como gasto)':'Vuelve a sumar como gasto');
  if(!!ca.debitado!==!!cb.debitado)out.push(cb.debitado?'Marcado como debitado':'Desmarcado como debitado');
  else if(cb.debitado&&(ca.debitadoFecha||'')!==(cb.debitadoFecha||''))out.push(`Fecha de débito: ${fmtF(ca.debitadoFecha)||'—'} → ${fmtF(cb.debitadoFecha)||'—'}`);
  return out;
}
function diffCargo(a,b){const out=[];
  if(Number(a.monto)!==Number(b.monto))out.push(`Monto: ${money(a.monto,monCta(a.cuenta))} → ${money(b.monto,monCta(b.cuenta))}`);
  if(a.fecha!==b.fecha)out.push(`Fecha: ${fmtF(a.fecha)} → ${fmtF(b.fecha)}`);
  if((a.desc||'')!==(b.desc||''))out.push(`Descripción: ${a.desc} → ${b.desc}`);return out}
const hora=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const ACC_TXT={crear:'cargó',editar:'editó',borrar:'borró',restaurar:'restauró',bajado:'marcó como bajado',debitado:'marcó como debitado',backup:'descargó el backup',config:'cambió la configuración',quitar:'quitó',reprogramar:'reprogramó',omitir:'salteó',facturar:'facturó',desfacturar:'anuló la facturación de'};
const TIPO_TXT={egreso:'un pago',debe:'un debe',descuento:'un descuento',cuenta:'la cuenta',programado:'el pago agendado',vencimiento:'el vencimiento',config:'',backup:''};
function vHist(){
  let l=Object.entries(S.log).map(([id,x])=>({id,...x})).sort((a,b)=>b.ts-a.ts);
  if(S.hUser!=='todos')l=l.filter(x=>x.user===S.hUser);

function abrirModal(html){$('#modal').innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;$('#modal .modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))cerrarModal()}}

// ---------- MOVIMIENTOS ----------
function estadoPill(e,id){
  if(e.estado==='pendiente')return `<button class="pill p-pend" data-baja="${id}">Pendiente bajar</button>`;
  if(e.estado==='bajado')return `<span class="pill p-ok">Bajado</span>`;
  return `<span class="pill p-na">Sin cta. cte.</span>`;
}
function vMov(){
  if(S.movModo==='dia')return vMovDia();
  const sem=rango('semana',0),mes=rango('mes',0);
  // Los cheques/echeq entran a Movimientos recién cuando se marcan debitados, con la fecha del
  // débito (fCaja). Los firmados sin debitar quedan aparte, en el filtro "Cheques sin debitar".
  const todosEg=listaEgresos().map(e=>({...e,fc:fCaja(e)}));
  const chSinDeb=todosEg.filter(e=>e.cheque&&!e.cheque.debitado);
  let l=S.movFiltro==='chq'?chSinDeb.map(e=>({...e,fc:e.cheque.venc||e.fecha})):todosEg.filter(e=>e.fc);
  const npend=todosEg.filter(e=>e.fc&&e.estado==='pendiente').length;
  if(S.movFiltro==='pend')l=l.filter(e=>e.estado==='pendiente');
  if(S.movFiltro==='sem')l=l.filter(e=>enRango(e.fc,sem));
  if(S.movFiltro==='mes')l=l.filter(e=>enRango(e.fc,mes));
  const b=S.movBusca.trim().toLowerCase();
  if(b)l=l.filter(e=>[e.nota,catNom(e.categoria),ctaNom(e.cuenta),medNom(e.medio),String(e.monto)].join(' ').toLowerCase().includes(b));
  l.sort((a,b)=>S.movFiltro==='chq'?a.fc.localeCompare(b.fc):(b.fc.localeCompare(a.fc)||(b.ts||0)-(a.ts||0)));
  const total=l.reduce((s,e)=>s+ars(e),0);
  const f=[['todos','Todos'],['pend',`Pendientes de bajar (${npend})`],['sem','Esta semana'],['mes','Este mes'],['chq',`Cheques sin debitar (${chSinDeb.length})`]];
  $('#vista').innerHTML=`${movModoToggle()}<div class="chips" style="margin-bottom:10px">${f.map(([k,t])=>`<button class="chip ${S.movFiltro===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div>
  <input id="mb" placeholder="Buscar por nota, cuenta, categoría o monto" value="${esc(S.movBusca)}" style="margin-bottom:10px">
  <div class="hdr" style="margin-bottom:8px"><span class="sub">${l.length} movimientos</span><span class="num" style="font-weight:700">${money(total)}</span></div>
  ${l.length?`<div class="list">${l.slice(0,S.movLimite).map(e=>`<div class="row" data-id="${e.id}">
    <div style="min-width:0"><div style="font-weight:700">${esc(ctaNom(e.cuenta)||e.nota||catNom(e.categoria))}</div>
    <div class="sub">${fmtFc(e.fc)} · ${esc(catNom(e.categoria))} · ${esc(medNom(e.medio))}${e.cheque?' N° '+esc(e.cheque.num)+(e.cheque.debitado?' debitado · firmado '+fmtFc(e.fecha):' vence '+fmtFc(e.cheque.venc)+' · sin debitar'):''}${e.soloAgenda?' · anterior, no suma':''}${USERS[e.creadoPor]?' · '+USERS[e.creadoPor].nombre:''}${e.nota&&e.cuenta?' · '+esc(e.nota):''}</div></div>
    <div style="text-align:right"><div class="num" style="font-weight:700">${money(e.monto,e.moneda)}</div>${e.moneda==='USD'?`<div class="sub num">≈ ${money(ars(e))}</div>`:''}<div style="margin-top:4px">${estadoPill(e,e.id)}</div></div></div>`).join('')}</div>
    ${l.length>S.movLimite?`<button id="mas" style="width:100%;margin-top:10px">Ver más</button>`:''}`
  :`<div class="empty">No hay movimientos con este filtro.</div>`}`;
  bindMovModo();
  document.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{S.movFiltro=x.dataset.f;S.movLimite=150;render()});
  const mb=$('#mb');mb.oninput=e=>{S.movBusca=e.target.value;clearTimeout(mb._t);mb._t=setTimeout(()=>{render();const n=$('#mb');n.focus();n.setSelectionRange(n.value.length,n.value.length)},350)};
  document.querySelectorAll('.row[data-id]').forEach(r=>r.onclick=()=>abrirEgreso(r.dataset.id));
  document.querySelectorAll('[data-baja]').forEach(x=>x.onclick=async ev=>{ev.stopPropagation();await db.ref(ROOT+'/egresos/'+x.dataset.baja).update({estado:'bajado',bajadoPor:S.user,bajadoTs:Date.now()});logAcc('bajado','egreso',x.dataset.baja,resEg(S.egresos[x.dataset.baja]));toast('Marcado como bajado')});
  const m=$('#mas');if(m)m.onclick=()=>{S.movLimite+=150;render()};
}

// ---------- MOVIMIENTOS POR DÍA (conciliación de egresos) ----------
// Agrupa los egresos por día y por medio de pago para compararlos con el sistema de gestión.
// Los cheques/echeq se ubican el día que VENCEN (cuando se debitan), no el día que se firmaron.
// No incluye los egresos "anteriores, no suman" (soloAgenda). La tilde de conciliado queda en
// conciliacion/{fecha}/{medioId} con quién y cuándo.
function movModoToggle(){return `<div class="chips" style="margin-bottom:10px"><button class="chip ${S.movModo!=='dia'?'on':''}" data-mm="lista">Lista</button><button class="chip ${S.movModo==='dia'?'on':''}" data-mm="dia">Por día</button></div>`}
function bindMovModo(){document.querySelectorAll('[data-mm]').forEach(x=>x.onclick=()=>{S.movModo=x.dataset.mm;render()})}
function fechaCaja(e){return e.cheque&&e.cheque.venc?e.cheque.venc:e.fecha}
function diaLargo(f){const d=fromIso(f).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'numeric'});return d.charAt(0).toUpperCase()+d.slice(1)}
function vMovDia(){
  if(!S.diaDesde||!S.diaHasta){S.diaDesde=hoy();S.diaHasta=hoy()}
  if(S.diaDesde>S.diaHasta){const t=S.diaDesde;S.diaDesde=S.diaHasta;S.diaHasta=t}
  const med=S.diaMedio||'';
  let l=listaEgresos().filter(e=>!e.soloAgenda).map(e=>({...e,fc:fCaja(e)})).filter(e=>e.fc&&e.fc>=S.diaDesde&&e.fc<=S.diaHasta);
  const nChSinDeb=listaEgresos().filter(e=>!e.soloAgenda&&e.cheque&&!e.cheque.debitado&&e.cheque.venc>=S.diaDesde&&e.cheque.venc<=S.diaHasta).length;
  if(med)l=l.filter(e=>e.medio===med);
  const dias={};l.forEach(e=>{(dias[e.fc]=dias[e.fc]||[]).push(e)});
  const fechas=Object.keys(dias).sort((a,b)=>b.localeCompare(a));
  const total=l.reduce((a,e)=>a+ars(e),0);
  const ordMed=id=>(S.cfg.medios?.[id]?.orden)??99;
  const t=hoy(),ay=addDias(t,-1),sem=rango('semana',0),mes=rango('mes',0);
  const atajos=[['hoy','Hoy',t,t],['ayer','Ayer',ay,ay],['sem','Esta semana',sem.desde,sem.hasta],['mes','Este mes',mes.desde,mes.hasta]];
  const medios=activos(S.cfg.medios);
  const bloques=fechas.map(f=>{
    const porMed={};dias[f].forEach(e=>{const k=e.medio||'_';(porMed[k]=porMed[k]||[]).push(e)});
    const tDia=dias[f].reduce((a,e)=>a+ars(e),0);
    const meds=Object.keys(porMed).sort((a,b)=>ordMed(a)-ordMed(b));
    const nConc=meds.filter(m=>S.conc?.[f]?.[m]).length;
    return `<div class="card" style="padding:0;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fafbfc;border-bottom:1px solid var(--line)">
        <div><div style="font-weight:700">${diaLargo(f)}</div><div class="sub">${dias[f].length} movimiento${dias[f].length!==1?'s':''} · ${nConc===meds.length?'<span style="color:var(--ok);font-weight:700">✓ conciliado</span>':nConc?`${nConc} de ${meds.length} medios conciliados`:'sin conciliar'}</div></div>
        <div class="num" style="font-weight:700;font-size:17px">${money(tDia)}</div>
      </div>
      ${meds.map(m=>{
        const es=porMed[m],tm=es.reduce((a,e)=>a+ars(e),0),c=S.conc?.[f]?.[m];
        return `<div style="border-bottom:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px">
            <label style="display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:14px;cursor:pointer">
              <input type="checkbox" data-conc="${f}|${m}" ${c?'checked':''} style="width:20px;height:20px;margin:0">
              <span><b>${esc(medNom(m)||'Sin medio')}</b>${c?`<span class="sub" style="display:block;margin:0">conciliado por ${esc(USERS[c.por]?.nombre||c.por||'')}</span>`:''}</span>
            </label>
            <span class="num" style="font-weight:700">${money(tm)}</span>
          </div>
          ${es.sort((a,b)=>(a.ts||0)-(b.ts||0)).map(e=>`<div class="row" data-id="${e.id}" style="padding:8px 14px 8px 42px;border-bottom:0">
            <div style="min-width:0"><div style="font-size:14px">${esc(ctaNom(e.cuenta)||e.nota||catNom(e.categoria))}</div>
            <div class="sub">${esc(catNom(e.categoria))}${e.cheque?' · N° '+esc(e.cheque.num)+' firmado '+fmtFc(e.fecha)+(e.cheque.venc&&e.cheque.venc!==e.fc?' · vencía '+fmtFc(e.cheque.venc):''):''}${e.nota&&e.cuenta?' · '+esc(e.nota):''}</div></div>
            <div style="text-align:right"><div class="num" style="font-size:14px">${money(e.monto,e.moneda)}</div>${e.moneda==='USD'?`<div class="sub num">≈ ${money(ars(e))}</div>`:''}</div>
          </div>`).join('')}
        </div>`}).join('')}
    </div>`}).join('');
  // Resumen del rango por medio (útil cuando se elige más de un día)
  const resMed={};l.forEach(e=>{const k=e.medio||'_';resMed[k]=(resMed[k]||0)+ars(e)});
  const resumen=S.diaDesde!==S.diaHasta&&l.length?`<div class="card"><div class="sub" style="margin:0 0 6px">Total del período por medio</div>${Object.keys(resMed).sort((a,b)=>ordMed(a)-ordMed(b)).map(m=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${esc(medNom(m)||'Sin medio')}</span><span class="num">${money(resMed[m])}</span></div>`).join('')}</div>`:'';
  $('#vista').innerHTML=`${movModoToggle()}
  <div class="chips" style="margin-bottom:8px">${atajos.map(([k,tx,d,h])=>`<button class="chip ${S.diaDesde===d&&S.diaHasta===h?'on':''}" data-at="${d}|${h}">${tx}</button>`).join('')}</div>
  <div class="grid2" style="margin-bottom:8px"><div><label for="dd" style="margin:0 0 4px">Desde</label><input id="dd" type="date" value="${S.diaDesde}"></div><div><label for="dh" style="margin:0 0 4px">Hasta</label><input id="dh" type="date" value="${S.diaHasta}"></div></div>
  <div class="chips" style="margin-bottom:10px"><button class="chip ${!med?'on':''}" data-md="">Todos los medios</button>${medios.map(([id,c])=>`<button class="chip ${med===id?'on':''}" data-md="${id}">${esc(c.nombre)}</button>`).join('')}</div>
  <div class="hdr" style="margin-bottom:8px;display:flex;justify-content:space-between"><span class="sub">${l.length} movimientos · ${fechas.length} día${fechas.length!==1?'s':''}</span><span class="num" style="font-weight:700">${money(total)}</span></div>
  ${resumen}
  ${bloques||'<div class="empty">No hay egresos en esas fechas.</div>'}
  <div class="sub" style="margin-top:8px">Los cheques y echeq aparecen recién cuando se marcan debitados en la Agenda, el día del débito.${nChSinDeb?` Hay ${nChSinDeb} que vence${nChSinDeb!==1?'n':''} en estas fechas y todavía no está${nChSinDeb!==1?'n':''} marcado${nChSinDeb!==1?'s':''} como debitado${nChSinDeb!==1?'s':''}.`:''}</div>`;
  bindMovModo();
  document.querySelectorAll('[data-at]').forEach(x=>x.onclick=()=>{const[d,h]=x.dataset.at.split('|');S.diaDesde=d;S.diaHasta=h;render()});
  $('#dd').onchange=e=>{if(e.target.value){S.diaDesde=e.target.value;render()}};
  $('#dh').onchange=e=>{if(e.target.value){S.diaHasta=e.target.value;render()}};
  document.querySelectorAll('[data-md]').forEach(x=>x.onclick=()=>{S.diaMedio=x.dataset.md;render()});
  document.querySelectorAll('[data-conc]').forEach(x=>x.onchange=async()=>{const[f,m]=x.dataset.conc.split('|');
    await db.ref(ROOT+'/conciliacion/'+f+'/'+m).set(x.checked?{por:S.user,ts:Date.now()}:null);toast(x.checked?'Marcado como conciliado':'Conciliación quitada')});
  document.querySelectorAll('.row[data-id]').forEach(r=>r.onclick=()=>abrirEgreso(r.dataset.id));
}

// ---------- CUENTAS ----------
function movimientosCuenta(cid){
  const m=[];
  Object.entries(S.cargos).forEach(([id,c])=>{if(c.cuenta!==cid)return;const h=c.lado==='haber';
    m.push({tipo:h?'haber':'debe',esDesc:h,id,fecha:c.fecha,desc:(h&&c.motivo?c.motivo+' · ':'')+c.desc,monto:Number(c.monto),ts:c.ts||0,codigo:c.codigo,cantidad:c.cantidad,precio:c.precio})});
  const mc=monCta(cid);
  Object.entries(S.egresos).forEach(([id,e])=>{if(e.cuenta!==cid)return;const otra=(e.moneda||'ARS')!==mc;
    m.push({tipo:'haber',id,fecha:e.fecha,desc:[e.cheque?`${medNom(e.medio)} N° ${e.cheque.num}${bancoNom(e.cheque.banco)?' · '+bancoNom(e.cheque.banco):''} · vence ${fmtFc(e.cheque.venc)}`:medNom(e.medio)?'Pago '+medNom(e.medio).toLowerCase():'Pago',e.nota,otra?`pagado ${money(e.monto,e.moneda)} a ${money(e.cotizacion)}`:''].filter(Boolean).join(' · '),monto:conv(e.monto,e.moneda,mc,e.cotizacion),ts:e.ts||0,estado:e.estado})});
  m.sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.tipo===b.tipo?0:a.tipo==='debe'?-1:1)||a.ts-b.ts);
  let s=0;m.forEach(x=>{s+=x.tipo==='debe'?x.monto:-x.monto;x.saldo=s});return m;
}
function saldoCuenta(cid){const m=movimientosCuenta(cid);return{saldo:m.length?m[m.length-1].saldo:0,debe:m.filter(x=>x.tipo==='debe').reduce((s,x)=>s+x.monto,0),haber:m.filter(x=>x.tipo==='haber').reduce((s,x)=>s+x.monto,0),ult:[...m].reverse().find(x=>x.tipo==='haber'&&!x.esDesc)}}
function vCuentas(){
  if(S.cuentaAbierta&&S.cuentas[S.cuentaAbierta])return vLedger(S.cuentaAbierta);
  const l=Object.entries(S.cuentas).filter(([,c])=>c.activo!==false&&c.tipo===S.cuentaTipo&&c.llevaCC).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre));
  const totA=l.filter(([id])=>monCta(id)==='ARS').reduce((s,[id])=>s+saldoCuenta(id).saldo,0),totU=l.filter(([id])=>monCta(id)==='USD').reduce((s,[id])=>s+saldoCuenta(id).saldo,0);
  const fp=factPendientes(),fsp=fp.filter(([,it])=>!(it.precio_taller>0)).length;
  $('#vista').innerHTML=`${fp.length?`<button id="irfact" class="card" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:#f59e0b;background:#fffbeb">
    <span><b>🧾 ${fp.length} corte${fp.length!==1?'s':''} finalizado${fp.length!==1?'s':''} para facturar</b><span class="sub" style="display:block;margin:2px 0 0">${fsp?fsp+' sin precio · ':''}tocá para revisar y facturar</span></span>
    <span class="num" style="font-weight:700">${money(fp.reduce((a,[,it])=>a+factMonto(it),0))}</span></button>`:''}
  <div class="chips" style="margin-bottom:10px">${TIPOS.map(t=>`<button class="chip ${S.cuentaTipo===t?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>
  <div class="hdr" style="margin-bottom:8px"><span class="sub">Saldo total ${S.cuentaTipo.toLowerCase()}</span><span class="num" style="font-weight:700">${money(totA)}${totU?' + '+money(totU,'USD'):''}</span></div>
  ${l.length?`<div class="list">${l.map(([id,c])=>{const s=saldoCuenta(id);return `<div class="row" data-c="${id}"><div><div style="font-weight:700">${esc(c.nombre)}</div><div class="sub">Debe ${money(s.debe,monCta(id))} · Haber ${money(s.haber,monCta(id))}</div></div><div class="num" style="font-weight:700;${s.saldo<0?'color:var(--ok)':''}">${money(s.saldo,monCta(id))}</div></div>`}).join('')}</div>`
  :`<div class="empty">No hay cuentas de ${S.cuentaTipo.toLowerCase()} con cuenta corriente. Creala desde Ajustes.</div>`}`;
  document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{S.cuentaTipo=x.dataset.t;render()});
  document.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{S.cuentaAbierta=x.dataset.c;window.scrollTo(0,0);render()});
  const irf=$('#irfact');if(irf)irf.onclick=()=>{S.view='fact';window.scrollTo(0,0);render()};
}
function vLedger(cid){
  const c=S.cuentas[cid],m=movimientosCuenta(cid),s=saldoCuenta(cid),mc=monCta(cid);
  $('#vista').innerHTML=`<button id="volver" style="margin-bottom:10px">Volver a cuentas</button>
  <div class="hdr" style="margin-bottom:8px"><span style="font-size:18px;font-weight:700">${esc(c.nombre)}</span><span class="sub">${esc(c.tipo)}${mc==='USD'?' · en dólares':''}</span></div>
  <div class="grid2" style="margin-bottom:10px"><div class="met"><div class="l">Saldo actual</div><div class="v num">${money(s.saldo,mc)}</div></div>
  <div class="met"><div class="l">Último pago</div><div class="num" style="font-weight:700;margin-top:4px">${s.ult?fmtFc(s.ult.fecha)+' · '+money(s.ult.monto,mc):'Sin pagos'}</div></div></div>
  <div class="actions" style="margin:0 0 10px"><button id="ldebe">Cargar debe</button><button id="ldesc">${c.tipo==='Empleados'?'Descuento':'Crédito / descuento'}</button><button id="lpago" class="pri">Cargar pago</button></div>
  ${(()=>{const ag=ocurrencias(addDias(hoy(),365)).filter(o=>!o.pagado&&o.p.cuenta===cid),tot=sumar(ag),dif=Math.round(s.saldo-tot);
    const chk=mc!=='ARS'||!ag.length?'':dif>0?`<span style="color:var(--danger)">Sin agendar: ${money(dif)}</span>`:dif<0?`<span style="color:var(--danger)">Agendado de más: ${money(-dif)}</span>`:'<span style="color:var(--ok)">Coincide con el saldo</span>';
    return `<div class="hdr" style="margin:4px 0 6px"><span style="font-weight:700">Compromisos agendados</span><span class="num" style="font-weight:700">${money(tot)}</span></div>
    ${ag.length?`<div class="list" id="lcomp">${ag.map(itemAgenda).join('')}</div><div class="hdr" style="margin:6px 2px 12px"><span class="sub" style="margin:0">${chk}</span>${s.saldo>0?'<button id="lagen" style="padding:6px 10px;font-size:13px">Agendar saldo</button>':''}</div>`
      :`<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 12px"><div class="sub" style="flex:1;margin:0">No hay pagos agendados para esta cuenta.</div>${s.saldo>0?'<button id="lagen" style="flex:none">Agendar saldo</button>':''}</div>`}
    <div style="font-weight:700;margin:4px 0 6px">Movimientos</div>`})()}
  ${m.length?`<div class="ledger-wrap"><table class="lg"><tr><th class="l">Fecha</th><th class="l">Descripción</th><th>Debe</th><th>Haber</th><th>Saldo</th></tr>
  ${m.map(x=>`<tr data-k="${x.esDesc?'desc':x.tipo}" data-id="${x.id}"><td class="l num">${fmtF(x.fecha)}</td><td class="l">${esc(x.desc)}${x.estado==='pendiente'?' <span class="pill p-pend">pend.</span>':''}${x.esDesc?' <span class="pill p-na">descuento</span>':''}</td>
  <td class="num">${x.tipo==='debe'?money(x.monto,mc):''}</td><td class="num h">${x.tipo==='haber'?money(x.monto,mc):''}</td><td class="num" style="font-weight:700">${money(x.saldo,mc)}</td></tr>`).join('')}</table></div>`
  :`<div class="empty">Esta cuenta todavía no tiene movimientos. Cargá lo que se le debe o un pago.</div>`}`;
  $('#volver').onclick=()=>{S.cuentaAbierta=null;render()};
  $('#ldebe').onclick=()=>abrirCargo(null,cid);
  const lcomp=$('#lcomp');if(lcomp)bindAgendaItems(lcomp);
  const lag=$('#lagen');if(lag)lag.onclick=()=>{const cat=activos(S.cfg.categorias).find(([,k])=>(c.tipo==='Talleres'&&k.nombre==='Talleres')||(c.tipo==='Empleados'&&/sueldo/i.test(k.nombre)));
    const ag=sumar(ocurrencias(addDias(hoy(),365)).filter(o=>!o.pagado&&o.p.cuenta===cid));
    if(ag&&!confirm(`Esta cuenta ya tiene ${money(ag)} agendados. Si agendás el saldo completo puede quedar contado dos veces en la agenda y en Caja. ¿Seguir igual?`))return;

// ---------- FACTURAR CORTES (desde Logística de la app de fábrica) ----------
// Lista los cortes cerrados (contados y controlados) en fabrica_v5/logistica que todavía no se
// facturaron, desde la fecha de arranque. Facturar crea el Debe en la cuenta del taller acá y marca
// el corte como facturado en fábrica (mismos campos que usaba la app de fábrica), en una sola escritura.
// Cantidad facturable = OK + Detalle + Fallado tela (el fallado taller no se paga), o la corregida a mano.
const factArranque=()=>S.cfg?.factArranque||'2026-10-01';
function factFechaIso(it){const m=String(it.fecha_entregado||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;return it.fecha_cerrado?iso(new Date(it.fecha_cerrado)):hoy()}
function factCierreIso(it){return it.fecha_cerrado?iso(new Date(it.fecha_cerrado)):factFechaIso(it)}
function factCant(it){if(it.facturacion_cantidad_manual!=null)return Number(it.facturacion_cantidad_manual)||0;return Object.values(it.grilla||{}).reduce((s,f)=>s+(f.ok||0)+(f.detalle||0)+(f.fallado_tela||0),0)}
function factMonto(it){return factCant(it)*(Number(it.precio_taller)||0)}
function factDest(it){return (it.taller||it.proveedor||'').trim()||'Sin taller'}
function factPendientes(){const a=factArranque();
  return Object.entries(S.logi||{}).filter(([,it])=>it&&it.estado==='cerrado'&&!it.no_facturar&&!it.facturado_cta_cte&&factCierreIso(it)>=a)}
function ctaDeTaller(nombre){const n=nombre.toLowerCase();
  const act=Object.entries(S.cuentas).filter(([,c])=>c.activo!==false&&c.llevaCC);
  const v=act.find(([,c])=>(c.tallerFab||'').toLowerCase()===n)||act.find(([,c])=>!c.tallerFab&&c.nombre.toLowerCase()===n);
  return v?v[0]:null}

  const grupos={};l.forEach(([id,it])=>{const k=factDest(it);(grupos[k]=grupos[k]||[]).push([id,it])});

      </div>

        return `<div style="display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap">

  $('#vista').innerHTML=`<button id="fvolver" style="margin-bottom:10px">Volver a cuentas</button>

      cid=uid();await db.ref(ROOT+'/cuentas/'+cid).set({nombre:t,tipo:'Talleres',llevaCC:true,activo:true,moneda:'ARS',tallerFab:t});logAcc('crear','cuenta',cid,`${t} · Talleres · cta. cte.`);return}

    if(S.cuentas[cid].tallerFab)await db.ref(ROOT+'/cuentas/'+cid+'/tallerFab').remove();else await db.ref(ROOT+'/cuentas/'+cid+'/tallerFab').set('—');render()});

    if(!confirm(`¿Facturar corte ${it.numero_corte||''} a ${factDest(it)} por ${money(factMonto(it))}?\n\n${factCant(it)} u. × ${money(it.precio_taller)}. Queda como Debe en la cuenta del taller.`))return;
    await factFacturar([id]);});
  document.querySelectorAll('[data-ftodos]').forEach(b=>b.onclick=async()=>{const t=b.dataset.ftodos;const ids=factPendientes().filter(([,it])=>factDest(it)===t&&it.precio_taller>0).map(([id])=>id);
    const tot=ids.reduce((a,id)=>a+factMonto(S.logi[id]),0);
    if(!confirm(`¿Facturar ${ids.length} cortes a ${t} por ${money(tot)}?`))return;await factFacturar(ids);});

async function factFacturar(ids){
  const up={},ahora=Date.now();let n=0;

  <div style="margin-top:4px">${dTxt(dlt(tA,tP))} <span class="sub">vs ${enCurso?'mismos días del período anterior':'período anterior'} (${money(tP)})</span></div></div>

// ---------- AGENDA DE PAGOS ----------
// Un "programado" es un pago a futuro (una vez, semanal, quincenal, mensual o en cuotas).
// Cada fecha que genera es una "ocurrencia"; en /ocurrencias/{prog}/{fechaOriginal} se guarda si se pagó,
// se reprogramó (fecha/monto) o se omitió.
const REPITE=[['una','Una vez'],['semanal','Semanal'],['quincenal','Quincenal'],['mensual','Mensual'],['cuotas','En cuotas']];
const corto=n=>n>=1e6?(Math.round(n/1e5)/10).toLocaleString('es-AR')+'M':n>=1e3?Math.round(n/1e3)+'k':String(Math.round(n));
function addMes(isoStr,n,dia){const d=fromIso(isoStr);const y=d.getFullYear(),m=d.getMonth()+n;const ult=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(dia,ult)))}
function addDias(isoStr,n){const d=fromIso(isoStr);d.setDate(d.getDate()+n);return iso(d)}
function fechasProgramado(p,hasta){
  const out=[],f0=p.fecha,dia=fromIso(f0).getDate();let i=0;
  if(p.repite==='una')out.push({k:f0});
  else if(p.repite==='cuotas'){for(i=0;i<(p.cuotas||1);i++)out.push({k:addMes(f0,i,dia),n:i+1,tot:p.cuotas})}
  else if(p.repite==='mensual'){for(i=0;i<600;i++){const k=addMes(f0,i,dia);if(k>hasta)break;out.push({k})}}
  else if(p.repite==='semanal'){let k=f0;for(i=0;i<600&&k<=hasta;i++){out.push({k});k=addDias(k,7)}}
  else if(p.repite==='quincenal'){const a2=addDias(f0,15),d2=fromIso(a2).getDate();
    for(i=0;i<600;i++){const k1=addMes(f0,i,dia),k2=addMes(a2,i,d2);if(k1>hasta&&k2>hasta)break;if(k1<=hasta)out.push({k:k1});if(k2<=hasta)out.push({k:k2})}}
  return out;
}
function ocurrencias(hasta){
  const out=[];
  Object.entries(S.programados).forEach(([pid,p])=>{if(!p||p.activo===false)return;
    fechasProgramado(p,hasta).forEach(o=>{const ov=(S.ocurr[pid]||{})[o.k]||{};if(ov.omitida)return;
      const f=ov.fecha||o.k;if(f>hasta&&!ov.pagado)return;
      out.push({prog:pid,k:o.k,fecha:f,monto:ov.monto??Number(p.monto),moneda:p.moneda||'ARS',pagado:!!ov.pagado,egresoId:ov.egresoId||null,n:o.n,tot:o.tot,p})})});
  return out.sort((a,b)=>a.fecha.localeCompare(b.fecha)||b.monto-a.monto);
}
const occNombre=o=>o.p.concepto+(o.n?` · cuota ${o.n} de ${o.tot}`:'');
const tagMedio=n=>n?`<span class="pill" style="background:var(--accent-bg);color:var(--accent);margin-left:6px;font-weight:700">${esc(n)}</span>`:'';
function vencTexto(v){const p=S.programados[v.prog];if(!p)return'vencimiento borrado';const o=ocurrencias('2100-01-01').find(x=>x.prog===v.prog&&x.k===v.k);return (o?occNombre(o):p.concepto)+' del '+fmtFc(o?o.fecha:v.k)}
// Opciones de vencimiento al cargar un egreso: solo pendientes de la cuenta elegida (o de la categoría si no hay cuenta), vencidos o de los próximos 30 días.
function pintarVenc(d,q){
  const box=q('#fv');if(!box)return;const wrap=q('#fvw');
  // Sin cuenta ni categoría elegida no se muestra nada: evita elegir un vencimiento que no tiene nada que ver.
  if(!d.cuenta&&!d.categoria&&!d.venc){wrap.classList.add('hidden');box.innerHTML='';return}
  const lim=addDias(hoy(),30);
  let l=ocurrencias(lim).filter(o=>!o.pagado);
  if(d.cuenta)l=l.filter(o=>o.p.cuenta===d.cuenta||(!o.p.cuenta&&d.categoria&&o.p.categoria===d.categoria));else if(d.categoria)l=l.filter(o=>o.p.categoria===d.categoria);else l=[];
  l=l.slice(0,6);
  if(d.venc&&!l.find(o=>o.prog===d.venc.prog&&o.k===d.venc.k)){const o=ocurrencias('2100-01-01').find(o=>o.prog===d.venc.prog&&o.k===d.venc.k);if(o)l.unshift(o)}
  // Si esa cuenta/categoría no tiene vencimientos pendientes, se oculta la pregunta entera.
  if(!l.length){wrap.classList.add('hidden');box.innerHTML='';return}
  wrap.classList.remove('hidden');
  box.innerHTML=`<button class="chip ${!d.venc?'on':''}" data-v="">No corresponde</button>`+l.map(o=>`<button class="chip ${d.venc&&d.venc.prog===o.prog&&d.venc.k===o.k?'on':''}" data-v="${o.prog}|${o.k}">${esc(occNombre(o))} · ${fmtFc(o.fecha)} · ${money(o.monto,o.moneda)}</button>`).join('');
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    if(!b.dataset.v){d.venc=null}else{const[prog,k]=b.dataset.v.split('|');d.venc={prog,k};const o=l.find(x=>x.prog===prog&&x.k===k);
      if(o&&!parseMonto(d.monto)){d.monto=(Math.round(o.monto*100)/100).toLocaleString('es-AR');q('#fm').value=d.monto;d.moneda=o.moneda;q('#fm').dispatchEvent(new Event('input'))}}
    box.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))});
}

// ---------- Caja proyectada ----------
// Disponible hoy (saldos cargados a mano) + venta estimada por día − lo agendado pendiente (incluye vencidos y cheques a debitar) hasta la fecha elegida.
// La venta estimada se suma desde mañana; lo de hoy se asume ya reflejado en los saldos.
function cajaFuentes(){return Object.entries((S.caja||{}).fuentes||{}).filter(([,f])=>f&&f.activo!==false).sort((a,b)=>(a[1].orden||0)-(b[1].orden||0))}
function cajaHasta(){return S.cajaHasta||rango('semana',0).hasta}
function cajaCalc(){
  const t=hoy(),hasta=cajaHasta(),v=(S.caja||{}).venta||{},porDia=Number(v.porDia)||0,dom=!!v.domingos;
  const disp=cajaFuentes().reduce((a,[,f])=>a+(Number(f.saldo)||0),0);
  const pend=agendaItems(hasta).filter(o=>!o.pagado&&o.fecha<=hasta);
  const pagosDia={};pend.forEach(o=>{const f=o.fecha<t?t:o.fecha;(pagosDia[f]=pagosDia[f]||[]).push(o)});
  let saldo=disp,ventaTot=0,min={saldo:disp,fecha:t};const filas=[];
  for(let f=t;f<=hasta;f=addDias(f,1)){
    const vta=f>t&&(dom||fromIso(f).getDay()!==0)?porDia:0,pg=pagosDia[f]?sumar(pagosDia[f]):0;
    ventaTot+=vta;saldo+=vta-pg;if(saldo<min.saldo)min={saldo,fecha:f};
    if(pg)filas.push({f,pg,n:pagosDia[f].length,saldo,vencidos:f===t&&pagosDia[f].some(o=>o.fecha<t)});
  }
  return{t,hasta,disp,ventaTot,pagos:sumar(pend),saldo,min,filas,porDia,dom};
}

  const c=cajaCalc(),fu=cajaFuentes(),rojo=n=>n<0?'color:var(--danger)':'';
  const act=fu.map(([,f])=>f.ts||0).reduce((a,b)=>Math.max(a,b),0),por=fu.find(([,f])=>f.ts===act);

  const dNom=f=>{const d=fromIso(f).toLocaleDateString('es-AR',{weekday:'short'});return d.charAt(0).toUpperCase()+d.slice(1).replace('.','')+' '+fmtFc(f)};
  return `<div class="card"><div class="hdr"><span style="font-weight:700">Disponible hoy</span><span class="num" style="font-weight:700">${money(c.disp)}</span></div>
    <p class="sub" style="margin-top:2px">${act?'Actualizado '+new Date(act).toLocaleString('es-AR',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})+(por&&USERS[por[1].por]?' por '+USERS[por[1].por].nombre:''):'Cargá los saldos de hoy.'}</p>
    ${fu.map(([id,f])=>`<div class="edit-item" style="padding:6px 0"><span>${esc(f.nombre)}</span><input data-fsal="${id}" class="num" inputmode="decimal" style="max-width:170px;text-align:right" value="${(Number(f.saldo)||0).toLocaleString('es-AR')}"><button data-fdel="${id}" aria-label="Quitar" style="padding:6px 9px">✕</button></div>`).join('')}
    <button id="fadd" style="margin-top:8px;font-size:13px;padding:6px 10px">+ Agregar cuenta o caja</button></div>
  <div class="card"><div style="font-weight:700">Venta aproximada</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><input id="cvta" class="num" inputmode="decimal" style="max-width:170px" value="${c.porDia.toLocaleString('es-AR')}"><span class="sub" style="margin:0">por día</span></div>
    <div class="chips" style="margin-top:8px"><button class="chip ${c.dom?'':'on'}" data-cdom="0">Sin domingos</button><button class="chip ${c.dom?'on':''}" data-cdom="1">Todos los días</button></div>
    <p class="sub">Se suma desde mañana.</p></div>
  <div class="card"><div style="font-weight:700">Calcular hasta</div>
    <div class="chips" style="margin-top:8px">${atajos.map(([n,f])=>`<button class="chip ${c.hasta===f?'on':''}" data-chas="${f}">${n}</button>`).join('')}</div>
    <input id="chas" type="date" value="${c.hasta}" style="margin-top:8px"></div>
  <div class="card"><div class="hdr"><span>Disponible hoy</span><span class="num">${money(c.disp)}</span></div>

    const up={};ids.forEach(id=>{up[id+'/cheque/debitadoFecha']=f});
    await db.ref(ROOT+'/egresos').update(up);
    logAcc('editar','egreso',null,`Cambió la fecha de débito de ${ids.length} cheque${ids.length>1?'s':''} al ${fmtF(f)} · N° ${ids.map(id=>S.egresos[id]?.cheque?.num).join(', ')}`);
    cerrarModal();toast(ids.length+' cheque'+(ids.length>1?'s':'')+' pasado'+(ids.length>1?'s':'')+' al '+fmtF(f))};
}
function abrirAnteriores(){
  const l=listaEgresos().filter(e=>e.cheque).sort((a,b)=>a.cheque.venc.localeCompare(b.cheque.venc));
  abrirModal(`<h2>Cheques anteriores</h2><p class="sub">Los que marques siguen en la agenda y en la lista de cheques, pero no suman en los reportes de gastos. Sirve para cheques que se firmaron antes de usar la app.</p>
  <div class="list" style="margin-top:10px">${l.map(e=>`<label class="row" style="margin:0;align-items:center;cursor:pointer"><input type="checkbox" data-ant="${e.id}" ${e.soloAgenda?'checked':''} style="width:auto;flex:none">
    <div style="flex:1"><div style="font-weight:700">N° ${esc(e.cheque.num)}${ctaNom(e.cuenta)||e.nota?' · '+esc(ctaNom(e.cuenta)||e.nota):''}</div><div class="sub">vence ${fmtF(e.cheque.venc)} · firmado ${fmtF(e.fecha)}</div></div>
    <div class="num" style="font-weight:700">${money(e.monto,e.moneda)}</div></label>`).join('')||'<div class="empty">No hay cheques cargados.</div>'}</div>
  <div class="actions"><button id="antcan">Cancelar</button><button class="pri" id="antok">Guardar</button></div>`);
  $('#antcan').onclick=cerrarModal;
  $('#antok').onclick=async()=>{let n=0;const up={};
    document.querySelectorAll('[data-ant]').forEach(c=>{const e=S.egresos[c.dataset.ant];if(!!e.soloAgenda!==c.checked){up[c.dataset.ant+'/soloAgenda']=c.checked?true:null;n++}});
    if(n){await db.ref(ROOT+'/egresos').update(up);logAcc('editar','egreso',null,`Cambió ${n} cheque${n>1?'s':''} entre anterior y normal`)}
    cerrarModal();toast(n?'Listo':'Sin cambios')};
}
function buscarOcc(prog,k){return ocurrencias('2100-01-01').find(o=>o.prog===prog&&o.k===k)}
function abrirPagar(prog,k){
  const o=buscarOcc(prog,k);if(!o)return;const p=o.p;
  const d=nuevoDraft({moneda:o.moneda,monto:(Math.round(o.monto*100)/100).toLocaleString('es-AR'),categoria:p.categoria||null,cuenta:p.cuenta||'',medio:p.medio||null,nota:occNombre(o),venc:{prog,k}});
  abrirModal(`<h2>Pagar · ${esc(occNombre(o))}</h2><p class="sub">Vence ${fmtF(o.fecha)}. Revisá monto y medio, y guardá.</p>`+formEgreso(d,false)+'<button id="fcan2" style="width:100%;margin-top:8px">Cancelar</button>');
  bindFormEgreso(d,false,$('#modal'),cerrarModal);$('#fcan2').onclick=cerrarModal;
}
function abrirOcc(prog,k){
  const o=buscarOcc(prog,k);if(!o)return;
  const rep=o.p.repite!=='una';
  abrirModal(`<h2>${esc(occNombre(o))}</h2><p class="sub">${fmtF(o.fecha)} · ${money(o.monto,o.moneda)}${o.pagado?' · Pagado':''}</p>
  ${o.pagado?`<div class="actions"><button id="overeg" class="pri">Ver egreso</button></div>`:`
  <div class="actions"><button id="opagar" class="pri">Pagar</button></div>
  <h3>Cambiar solo esta fecha</h3>
  <div class="grid2"><div><label for="ofe">Nueva fecha</label><input id="ofe" type="date" value="${o.fecha}"></div><div><label for="omo">Monto</label><input id="omo" class="num" inputmode="decimal" value="${Math.round(o.monto).toLocaleString('es-AR')}"></div></div>
  <div class="actions"><button id="oomit" class="dan">${rep?'Saltear esta fecha':'Cancelar este pago'}</button><button id="orep">Guardar cambio</button></div>`}
  <h3>Toda la programación</h3>
  <p class="sub">${esc(REPITE.find(r=>r[0]===o.p.repite)?.[1]||'')}${o.p.repite==='cuotas'?' · '+o.p.cuotas+' cuotas':''} desde ${fmtF(o.p.fecha)}</p>
  <div class="actions"><button id="oedit">Editar</button><button id="oborr" class="dan">Borrar programación</button></div>
  <button id="ocer" style="width:100%;margin-top:8px">Cerrar</button>`);
  const ref=db.ref(ROOT+'/ocurrencias/'+prog+'/'+k);
  $('#ocer').onclick=cerrarModal;
  if(o.pagado){$('#overeg').onclick=()=>{cerrarModal();if(o.egresoId&&S.egresos[o.egresoId])abrirEgreso(o.egresoId);else toast('El egreso ya no existe')}}
  else{
    $('#opagar').onclick=()=>abrirPagar(prog,k);
    $('#orep').onclick=async()=>{const f=$('#ofe').value,m=parseMonto($('#omo').value);if(!f||!m){toast('Poné fecha y monto');return}await ref.update({fecha:f===k?null:f,monto:m===Number(o.p.monto)?null:m});logAcc('reprogramar','vencimiento',prog,occNombre(o),{cambios:[f!==o.fecha?`Fecha: ${fmtF(o.fecha)} → ${fmtF(f)}`:'',m!==o.monto?`Monto: ${money(o.monto,o.moneda)} → ${money(m,o.moneda)}`:''].filter(Boolean)});cerrarModal();toast('Fecha actualizada')};
    $('#oomit').onclick=async()=>{if(!confirm(rep?'¿Saltear solo esta fecha?':'¿Cancelar este pago agendado?'))return;
      if(rep)await ref.update({omitida:true});else await db.ref(ROOT+'/programados/'+prog).update({activo:false});logAcc('omitir','vencimiento',prog,occNombre(o)+' del '+fmtF(o.fecha));cerrarModal();toast('Listo')};
  }
  $('#oedit').onclick=()=>abrirProgramado(prog);
  $('#oborr').onclick=async()=>{if(!confirm('¿Borrar toda la programación? Los pagos ya hechos quedan en egresos.'))return;await db.ref(ROOT+'/programados/'+prog).update({activo:false});logAcc('borrar','programado',prog,o.p.concepto);cerrarModal();toast('Programación borrada')};
}
function abrirProgramado(id,pre){
  const p=id?S.programados[id]:Object.assign({concepto:'',monto:'',fecha:hoy(),repite:'una',cuotas:'',categoria:null,cuenta:'',medio:null},pre||{});
  const cats=activos(S.cfg.categorias),meds=activos(S.cfg.medios);
  abrirModal(`<h2>${id?'Editar pago agendado':'Agendar pago'}</h2>
  <label for="pc">Concepto</label><input id="pc" value="${esc(p.concepto)}" placeholder="Alquiler local">
  <label for="pm">Monto${p.repite==='cuotas'?' de cada cuota':''}</label><input id="pm" class="num" inputmode="decimal" value="${p.monto?Number(p.monto).toLocaleString('es-AR'):''}" placeholder="650.000" style="font-size:20px;font-weight:700">
  <label for="pf">${id?'Primera fecha':'Fecha (o primera fecha si se repite)'}</label><input id="pf" type="date" value="${p.fecha}">
  <div class="chips" id="pmo" style="margin-top:8px"><button class="chip ${(p.moneda||'ARS')==='ARS'?'on':''}" data-v="ARS">Pesos</button><button class="chip ${p.moneda==='USD'?'on':''}" data-v="USD">Dólares</button></div>
  <label>Se repite</label><div class="chips" id="pr">${REPITE.map(([k,t])=>`<button class="chip ${p.repite===k?'on':''}" data-r="${k}">${t}</button>`).join('')}</div>
  <div id="pcuo" class="${p.repite==='cuotas'?'':'hidden'}"><label for="pn">Cantidad de cuotas</label><input id="pn" inputmode="numeric" value="${esc(p.cuotas||'')}" placeholder="6"></div>
  <p class="sub" id="pqh">${p.repite==='quincenal'?'Quincenal: la fecha que elijas y 15 días después, todos los meses.':''}</p>
  <label>Categoría</label><div class="chips" id="pca">${cats.map(([k,c])=>`<button class="chip ${p.categoria===k?'on':''}" data-id="${k}">${esc(c.nombre)}</button>`).join('')}</div>
  <label for="pa">Cuenta (opcional)</label><select id="pa">${opcionesCuentas(p.cuenta)}</select>
  <label>Medio previsto</label><div class="chips" id="pme">${meds.map(([k,c])=>`<button class="chip ${p.medio===k?'on':''}" data-id="${k}">${esc(c.nombre)}</button>`).join('')}</div>
  ${id?'<p class="sub">Si cambiás la fecha o la repetición, los cambios hechos a fechas sueltas pueden perderse. Lo ya pagado no se toca.</p>':''}
  <div id="perr" class="err"></div>
  <div class="actions"><button id="pcan">Cancelar</button><button class="pri" id="pok">Guardar</button></div>`);
  let rep=p.repite,cat=p.categoria,med=p.medio,pmon=p.moneda||'ARS';
  document.querySelectorAll('#pmo .chip').forEach(b=>b.onclick=()=>{pmon=b.dataset.v;document.querySelectorAll('#pmo .chip').forEach(x=>x.classList.toggle('on',x===b))});
  document.querySelectorAll('#pr .chip').forEach(b=>b.onclick=()=>{rep=b.dataset.r;document.querySelectorAll('#pr .chip').forEach(x=>x.classList.toggle('on',x===b));$('#pcuo').classList.toggle('hidden',rep!=='cuotas');$('#pqh').textContent=rep==='quincenal'?'Quincenal: la fecha que elijas y 15 días después, todos los meses.':''});
  document.querySelectorAll('#pca .chip').forEach(b=>b.onclick=()=>{cat=b.dataset.id;document.querySelectorAll('#pca .chip').forEach(x=>x.classList.toggle('on',x===b))});
  document.querySelectorAll('#pme .chip').forEach(b=>b.onclick=()=>{med=b.dataset.id;document.querySelectorAll('#pme .chip').forEach(x=>x.classList.toggle('on',x===b))});
  $('#pa').onchange=e=>{const c=S.cuentas[e.target.value];if(c){pmon=c.moneda||'ARS';document.querySelectorAll('#pmo .chip').forEach(x=>x.classList.toggle('on',x.dataset.v===pmon))}if(c&&!cat){const m=cats.find(([,k])=>(c.tipo==='Talleres'&&k.nombre==='Talleres')||(c.tipo==='Empleados'&&/sueldo/i.test(k.nombre)));if(m){cat=m[0];document.querySelectorAll('#pca .chip').forEach(x=>x.classList.toggle('on',x.dataset.id===cat))}}};
  $('#pm').onblur=e=>{const v=parseMonto(e.target.value);if(v)e.target.value=v.toLocaleString('es-AR')};
  $('#pcan').onclick=cerrarModal;
  $('#pok').onclick=async()=>{
    const concepto=$('#pc').value.trim(),monto=parseMonto($('#pm').value),fecha=$('#pf').value,cu=parseInt($('#pn').value,10);
    if(!concepto){$('#perr').textContent='Poné un concepto.';return}
    if(!monto){$('#perr').textContent='Poné un monto.';return}
    if(!fecha){$('#perr').textContent='Poné una fecha.';return}
    if(rep==='cuotas'&&!(cu>=1&&cu<=120)){$('#perr').textContent='Poné la cantidad de cuotas.';return}
    if(!cat){$('#perr').textContent='Elegí una categoría.';return}
    const rec={concepto,monto,moneda:pmon,fecha,repite:rep,cuotas:rep==='cuotas'?cu:null,categoria:cat,cuenta:$('#pa').value||null,medio:med||null,activo:true};
    const rs=`${concepto} · ${money(monto,pmon)} · ${REPITE.find(r=>r[0]===rep)[1]}${rep==='cuotas'?' ('+cu+')':''} desde ${fmtF(fecha)}`;
    if(id){rec.editadoPor=S.user;await db.ref(ROOT+'/programados/'+id).update(rec);logAcc('editar','programado',id,rs)}else{rec.creadoPor=S.user;rec.ts=Date.now();const nid=uid();await db.ref(ROOT+'/programados/'+nid).set(rec);logAcc('crear','programado',nid,rs)}
    cerrarModal();toast(rep==='cuotas'?`${cu} cuotas agendadas`:'Pago agendado');
  };
}

// ---------- BACKUP EXCEL ----------
function nombreHoja(n,usados){let b=String(n).replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,28)||'Cuenta';let x=b,i=2;while(usados.has(x.toLowerCase()))x=b.slice(0,25)+' '+(i++);usados.add(x.toLowerCase());return x}
async function descargarBackup(){
  try{
    const wb=XLSX.utils.book_new(),usados=new Set(['egresos','debe cargado','saldos']);
    const eg=listaEgresos().sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const est={pendiente:'Pendiente de bajar',bajado:'Bajado',na:'Sin cta. cte.'};
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(eg.map(e=>({Fecha:fmtF(e.fecha),Monto:Number(e.monto),Moneda:e.moneda||'ARS',Cotización:e.cotizacion||'','Monto en pesos':Math.round(ars(e)*100)/100,'Suma como gasto':noGasto(e)?'No':'Sí',Categoría:catNom(e.categoria),Cuenta:ctaNom(e.cuenta),'Medio de pago':medNom(e.medio),Estado:est[e.estado]||'',Nota:e.nota||'','Cargado por':USERS[e.creadoPor]?.nombre||e.creadoPor||'',Comprobante:e.foto||''}))),'Egresos');
    const cg=Object.values(S.cargos).sort((a,b)=>a.fecha.localeCompare(b.fecha));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cg.map(c=>({Fecha:fmtF(c.fecha),Cuenta:ctaNom(c.cuenta),Código:c.codigo||'',Descripción:c.descBase||c.desc,Cantidad:c.cantidad||'',Precio:c.precio||'',Debe:c.lado==='haber'?'':Number(c.monto),'Descuento (haber)':c.lado==='haber'?Number(c.monto):'',Motivo:c.motivo||'',Moneda:monCta(c.cuenta)}))),'Debe cargado');
    const ctas=Object.entries(S.cuentas).filter(([,c])=>c.llevaCC).sort((a,b)=>TIPOS.indexOf(a[1].tipo)-TIPOS.indexOf(b[1].tipo)||a[1].nombre.localeCompare(b[1].nombre));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ctas.map(([id,c])=>{const s=saldoCuenta(id);return{Cuenta:c.nombre,Tipo:c.tipo,Moneda:c.moneda||'ARS',Debe:s.debe,Haber:s.haber,Saldo:s.saldo,Activa:c.activo===false?'No':'Sí'}})),'Saldos');
    ctas.forEach(([id,c])=>{const m=movimientosCuenta(id);if(!m.length)return;
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(m.map(x=>({Fecha:fmtF(x.fecha),Descripción:x.desc,Debe:x.tipo==='debe'?x.monto:'',Haber:x.tipo==='haber'?x.monto:'',Saldo:x.saldo,Estado:x.tipo==='haber'?(est[x.estado]||''):''}))),nombreHoja(c.nombre,usados))});
    const ch=listaEgresos().filter(e=>e.cheque).sort((a,b)=>a.cheque.venc.localeCompare(b.cheque.venc));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ch.map(e=>({'NUM CHEQUE':e.cheque.num,MES:mesNom(e.cheque.venc),VENC:fmtF(e.cheque.venc),IMPORTE:Number(e.monto),MONEDA:e.moneda||'ARS','RAZON SOCIAL':razonNom(e.cheque.razon),BANCO:bancoNom(e.cheque.banco),PROVEEDOR:ctaNom(e.cuenta),'FECHA FIRMADO':fmtF(e.fecha),TIPO:medNom(e.medio),ANTERIOR:e.soloAgenda?'Sí':'No',ESTADO:e.cheque.debitado?'Debitado':'A debitar'}))),nombreHoja('Cheques',usados));
    const ag=ocurrencias(addDias(hoy(),120)).filter(o=>!o.pagado);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ag.map(o=>({Vence:fmtF(o.fecha),Concepto:occNombre(o),Monto:o.monto,Moneda:o.moneda,Categoría:catNom(o.p.categoria),Cuenta:ctaNom(o.p.cuenta),'Medio previsto':medNom(o.p.medio),Estado:o.fecha<hoy()?'Vencido':'Pendiente'}))),nombreHoja('Agenda pendiente',usados));
    XLSX.writeFile(wb,`Backup egresos By Nina ${hoy()}.xlsx`);
    await db.ref(ROOT+'/config/ultimoBackup').set({fecha:new Date().toISOString(),por:S.user});logAcc('backup','backup',null,'');
    toast('Backup descargado');
  }catch(err){console.error(err);alert('No se pudo generar el backup: '+err.message)}
}

render=function(){const a=document.activeElement;if(a&&$('#app').contains(a)&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&a.id!=='mb'){_pend=true;return}_pend=false;_render()};
